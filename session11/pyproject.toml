[project]
name = "session11"
version = "0.1.0"
description = "Meeting Note Assistant — Notes, Decisions, and Action Items"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
